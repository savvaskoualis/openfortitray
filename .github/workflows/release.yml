name: Release

# Fires on version tags only (v1.2.3, v0.1.0-rc1, ...). Build flags below mirror
# the Makefile `release` target's per-OS builds — if you change one, change both.
#
# cmd/openfortitray is a Wails v2 app. Wails' darwin and linux frontends need
# cgo (Cocoa/WebKit on darwin, GTK3/WebKit2GTK on linux), so those two build on
# their own native runners with CGO_ENABLED=1 — cross-building linux from one
# ubuntu host with CGO_ENABLED=0 is not an option for either. windows is
# different: Wails' windows webview binding (wailsapp/go-webview2) and
# energye/systray's windows backend are both pure Go (verified: no
# `import "C"` in either), so windows builds with CGO_ENABLED=0 and needs no C
# toolchain at all. macOS additionally ships a real .app bundle (a menu-bar/
# LSUIElement app needs one) inside a drag-to-/Applications .dmg, the primary
# macOS download.
on:
  push:
    tags:
      - 'v*'
  # Manual dry-run: build all artifacts (incl. the .dmg and the Windows
  # installer) without publishing, so the packaging path can be verified on a
  # branch before a real tag. The publish job is gated to tag refs below.
  workflow_dispatch:

# Least privilege at the top; only the publishing job widens to contents: write.
permissions:
  contents: read

# bash everywhere, including the windows runner (Git Bash), so the checksum
# steps share one implementation and emit the sha256sum -c format downstream.
defaults:
  run:
    shell: bash

jobs:
  # darwin needs cgo (Wails' darwin frontend and this repo's own
  # darkmode_darwin.go/dockpolicy_darwin.go/wake_darwin.go drive the Cocoa
  # status bar and window via cgo), so it must build on a macOS runner.
  # macos-14 is Apple Silicon, so this is arm64 only — the amd64 (Intel) leg
  # was dropped earlier in the Qt6->Wails migration, back when this job still
  # installed Qt6 via Homebrew: that required a second, x86_64 Homebrew
  # install cross-built under Rosetta, and Homebrew had stopped shipping
  # precompiled Intel bottles for some of Qt6's own dependencies (confirmed
  # live: "openssl@3: no bottle available!", now Tier 3/community-support-
  # only). This task removed the Homebrew/Qt6 install step from this job
  # entirely, so that specific blocker is now gone — but re-adding Intel/
  # amd64 macOS support is a separate decision this task doesn't make, so
  # build-darwin stays arm64-only pending that future call.
  build-darwin:
    name: Build darwin (arm64 + .dmg)
    runs-on: macos-14
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true

      # cgo on darwin needs the Xcode Command Line Tools (clang + the macOS
      # SDK). They ship on the macos-14 runner by default; this fails fast with
      # a clear message if that ever changes rather than deep inside `go build`.
      - name: Verify Xcode Command Line Tools
        run: |
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path

      # The build version is stamped into main.version (shown in the tray header)
      # via -X main.version=${GITHUB_REF_NAME}, merged into the -ldflags below
      # (alongside -s -w, and -H=windowsgui on the windows job).
      - name: Build darwin binary
        # -s -w strips the symbol table and DWARF to trim the binary's size.
        # No PKG_CONFIG_PATH/Qt pkg-config wiring needed: Wails' darwin
        # frontend links Cocoa/WebKit, both system frameworks with no
        # pkg-config lookup required. -tags production selects Wails'
        # internal/app real CreateApp/Run implementation; without it every
        # platform's build falls back to a stub that fails wails.Run() at
        # startup with "Wails applications will not build without the
        # correct build tags." (v0.3.0 shipped without this tag on all three
        # platforms — masked there by tray.Setup's now-fixed startup crash,
        # which always hit first). CGO_LDFLAGS supplies
        # UniformTypeIdentifiers.framework, which Wails' darwin frontend
        # (WailsContext.m, UTType) needs but doesn't link itself under
        # -tags production — an upstream gap in wails v2.9.2 — so the plain
        # `go build` here would otherwise fail at link time with "Undefined
        # symbols ... _OBJC_CLASS_$_UTType".
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CGO_LDFLAGS="-framework UniformTypeIdentifiers" \
            go build -tags production -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/openfortitray-darwin-arm64 ./cmd/openfortitray
          ls -l dist

      - name: Verify architecture
        # Cheap guard against a silently-wrong build.
        run: file dist/openfortitray-darwin-arm64 | grep -q 'arm64'

      # A menu-bar app needs a real .app bundle (Info.plist + LSUIElement) to
      # host the status item reliably and stay off the Dock. `make dmg`
      # depends on `make app` (which rebuilds the host-arch arm64 binary and
      # assembles the bundle with the hand-rolled Info.plist + generated .icns),
      # then wraps it in a double-click, drag-to-/Applications disk image — the
      # primary macOS download, superseding the old OpenFortiTray.app.zip.
      # VERSION stamps the filename to OpenFortiTray-<tag>.dmg. The runner is
      # headless, so `make dmg` uses its hdiutil builder (create-dmg is not
      # installed here): a valid, mountable UDZO image with the Applications
      # symlink, just a plainer window than a create-dmg layout.
      - name: Build OpenFortiTray.dmg
        run: |
          make dmg VERSION="${GITHUB_REF_NAME}"
          ls -l dist

      # Checksums are computed HERE, on the runner that produced the bytes, so
      # the verification in the release job actually covers the upload/download
      # round trip. `shasum -a 256` rather than `sha256sum`: macOS runners ship
      # BSD tools and have no coreutils sha256sum. The output format is
      # byte-identical to sha256sum's, so `sha256sum -c` consumes it downstream.
      - name: Checksum darwin artifacts
        working-directory: dist
        run: |
          shasum -a 256 \
            openfortitray-darwin-arm64 \
            "OpenFortiTray-${GITHUB_REF_NAME}.dmg" > SHA256SUMS.darwin
          cat SHA256SUMS.darwin

      - name: Upload darwin artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-darwin
          path: |
            dist/openfortitray-darwin-arm64
            dist/OpenFortiTray-${{ github.ref_name }}.dmg
            dist/SHA256SUMS.darwin
          if-no-files-found: error
          retention-days: 7

  # linux is a cgo build (Wails' linux frontend embeds GTK3/WebKit2GTK via
  # cgo+pkg-config), so it must build on a linux runner with those dev
  # headers, not cross-compiled with cgo off. Consequence: the linux binary
  # carries a glibc version floor from ubuntu-latest (it no longer runs on
  # arbitrarily old glibc). Runtime still needs an SNI-capable panel
  # (unchanged) plus webkit2gtk (see below).
  build-linux:
    name: Build linux (amd64)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true

      # cmd/openfortitray links against Wails v2 (see cmd/openfortitray/main.go,
      # wailsapp.go), whose linux frontend cgo-imports gtk+-3.0 and
      # webkit2gtk-4.x via pkg-config (github.com/wailsapp/wails/v2/internal/
      # frontend/desktop/linux/*.go) to build. ubuntu-latest is now 24.04
      # (Noble), which dropped libwebkit2gtk-4.0-dev entirely — only
      # libwebkit2gtk-4.1-dev is packaged there — so this installs the 4.1 dev
      # package and the build below passes -tags webkit2_41 to select it (the
      # cgo pkg-config directive defaults to webkit2gtk-4.0 without that tag).
      # This is Wails' own documented fix for Ubuntu 24.04+
      # (wailsapp/wails#3465, #3513).
      - name: Install webkit2gtk/GTK3 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build linux binary
        # -s -w trims the binary's size. Ships the bare binary: there is no
        # linux/.desktop asset in the repo, so no .tar.xz is assembled here.
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -tags webkit2_41,production -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/openfortitray-linux-amd64 ./cmd/openfortitray
          ls -l dist

      - name: Checksum linux binary
        working-directory: dist
        run: |
          sha256sum openfortitray-linux-amd64 > SHA256SUMS.linux
          cat SHA256SUMS.linux

      - name: Upload linux binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-linux
          path: |
            dist/openfortitray-linux-amd64
            dist/SHA256SUMS.linux
          if-no-files-found: error
          retention-days: 7

  # windows needs NO cgo: Wails' windows webview binding
  # (github.com/wailsapp/go-webview2, used by wails' internal windows
  # frontend) and github.com/energye/systray's windows backend
  # (systray_windows.go) are both pure Go — win32 calls via syscall/unsafe,
  # no `import "C"` anywhere in either dependency's windows-tagged files
  # (energye/systray's only cgo file, systray_darwin.go, is darwin-only).
  # Verified locally: `CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build
  # ./cmd/openfortitray` succeeds from a non-windows host. So this job needs
  # no C toolchain at all — the old MinGW-w64/Qt6 MSYS2 setup is gone.
  # -H=windowsgui keeps the tray app from popping a console window.
  build-windows:
    name: Build windows (amd64)
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true

      # Embed the Windows application manifest AND the app icon into a .syso so
      # the exe ALWAYS runs elevated (requireAdministrator) from any launch
      # path — Start-menu shortcut, manual launch, or the /RL HIGHEST login
      # task — because openconnect needs Administrator to create the wintun
      # adapter and there is no privileged helper on Windows, and so the exe
      # carries a real application icon (-ico) instead of the generic file icon
      # in Explorer/taskbar. Go auto-links a GOOS/GOARCH-scoped *.syso in the
      # main package dir into the windows exe; we generate it here from the
      # checked-in manifest + committed .ico rather than commit a binary blob
      # (the .syso is gitignored). rsrc is pure Go (no cgo, no MinGW needed) and
      # pinned to a full version like every action above. -arch amd64 matches
      # the single arch built below. Mirrors the Makefile `winres` target.
      - name: Embed Windows manifest + icon (generate .syso)
        run: |
          go run github.com/akavel/rsrc@v0.10.2 \
            -manifest cmd/openfortitray/openfortitray.manifest \
            -ico assets/icons/openfortitray.ico \
            -arch amd64 \
            -o cmd/openfortitray/resource_windows_amd64.syso

      - name: Build windows binary
        # -s -w trims size; -H=windowsgui suppresses the console window.
        # CGO_ENABLED=0 per the job comment above (no cgo used on windows).
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOARCH=amd64 \
            go build -tags production -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -H=windowsgui" -o dist/openfortitray-windows-amd64.exe ./cmd/openfortitray
          ls -l dist

      # No Mesa/software-OpenGL bundling and no Qt6 runtime/DLL-closure
      # bundling here anymore (Wails migration): the Go process itself no
      # longer renders anything and needs no OpenGL context at all — the UI
      # renders inside WebView2, an OS-provided, separately-installed
      # Chromium-based component with its own GPU/software-rendering fallback
      # (SwiftShader/ANGLE), entirely outside this process. There is nothing
      # in this codebase (see main.go's func main() comment, which explicitly
      # notes the old GALLIUM_DRIVER workaround was dropped rather than
      # ported) suggesting the Go process itself still needs a GL context.
      # WebView2 itself ships separately (see the WebView2 bootstrap in
      # scripts/openfortitray.iss) rather than as a DLL bundled here.

      # Bundle openconnect + its full DLL closure + wintun + vpnc-script next to
      # the app so Windows is turnkey. There is no reliable way to install
      # openconnect on a locked-down Cloud PC (winget is a dead stub; there is no
      # openconnect package for a stock Windows install), so we BUILD it once from
      # source (.github/workflows/build-openconnect.yml) and download the pinned,
      # sha256-verified result here. The prebuilt
      # zip was itself validated in the build workflow by a stripped-PATH
      # `openconnect --version` self-check, so an incomplete DLL closure could never
      # have been published. The app resolves this bundled binary at runtime
      # (resolveOpenconnectPath). Re-run build-openconnect + re-pin below only to
      # bump the openconnect/wintun version.
      - name: Bundle openconnect (prebuilt, pinned + verified)
        env:
          OC_BUNDLE_URL: 'https://github.com/savvaskoualis/openfortitray/releases/download/deps-openconnect-9.12/openconnect-win-amd64-9.12.zip'
          OC_BUNDLE_SHA256: '147008a42e68dcfcf7a311340e1aabc71f5affe026c7996c25948fea5cb2c595'
        run: |
          set -euo pipefail
          # --retry alone only retries timeouts and 5xx, so a bare "curl: (52)
          # Empty reply from server" from the releases CDN failed the whole
          # release (seen on v0.1.20). --retry-all-errors covers 52 and friends;
          # the sha256 check below is what actually decides the bytes are right.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 -o oc-bundle.zip "$OC_BUNDLE_URL"
          echo "${OC_BUNDLE_SHA256}  oc-bundle.zip" | sha256sum -c -
          mkdir -p dist
          # The zip contains a top-level openconnect/ dir, so it extracts to
          # dist/openconnect/ — exactly what openfortitray.iss installs into {app}.
          unzip -o oc-bundle.zip -d dist
          rm -f oc-bundle.zip
          test -s dist/openconnect/openconnect.exe
          test -s dist/openconnect/libopenconnect-5.dll
          test -s dist/openconnect/wintun.dll
          test -s dist/openconnect/vpnc-script-win.js
          echo "== bundled openconnect =="
          ls -l dist/openconnect | head -50

      # Fetch the WebView2 Runtime "Evergreen" bootstrapper: a small (~2 MB)
      # stub that downloads and installs the current WebView2 Runtime at
      # install time if the target machine does not already have it (Wails'
      # window renders inside WebView2 — an OS-provided component, present by
      # default on Windows 11 and most updated Windows 10 machines). Fetched
      # from Microsoft's own documented Evergreen Bootstrapper URL. Unlike the
      # openconnect bundle above, this is intentionally NOT sha256-pinned: it
      # is *designed* to always be Microsoft's current stub — pinning it to
      # one hash would defeat the point and go stale.
      # openfortitray.iss stages it into {tmp} (Flags: dontcopy) and only runs
      # it when WebView2 is not already present (IsWebView2Installed).
      - name: Download WebView2 Bootstrapper
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 -o dist/MicrosoftEdgeWebview2Setup.exe \
            "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          test -s dist/MicrosoftEdgeWebview2Setup.exe
          ls -l dist/MicrosoftEdgeWebview2Setup.exe

      # Inno Setup is preinstalled on windows-latest (6.7.x); the build step below
      # calls ISCC.exe by its fixed install path. We deliberately do NOT
      # `choco install` a pinned version — choco refuses to "downgrade" over the
      # newer preinstalled build and fails the job.
      - name: Verify Inno Setup present
        run: |
          test -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            || { echo "ISCC.exe not found at the expected path"; exit 1; }

      # ISCC compiles scripts/openfortitray.iss. Source/OutputDir in the .iss are
      # resolved relative to the script (scripts/), so ..\dist picks up the exe
      # just built above and drops OpenFortiTray-<version>-Setup.exe back into
      # dist/. Version comes from the tag with the leading v stripped (Inno's
      # AppVersion wants a number); fall back to 0.0.0-dev for non-tag runs so
      # ISCC never fails on an empty define. The //D form stops Git Bash's MSYS
      # path mangling from rewriting the /D switch.
      - name: Build Windows installer (Inno Setup)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="0.0.0-dev"
          echo "SETUP_VERSION=$VERSION" >> "$GITHUB_ENV"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            //DMyAppVersion="$VERSION" scripts/openfortitray.iss
          ls -l dist

      - name: Checksum windows artifacts
        # Git Bash on the windows runner provides coreutils sha256sum, so the
        # manifest format matches the other runners' and `sha256sum -c` verifies.
        # The bare exe (for scripted/CLI installs) and the Setup.exe wizard are
        # hashed here, on the runner that produced them.
        working-directory: dist
        run: |
          sha256sum \
            openfortitray-windows-amd64.exe \
            "OpenFortiTray-${SETUP_VERSION}-Setup.exe" > SHA256SUMS.windows
          cat SHA256SUMS.windows

      - name: Upload windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-windows
          path: |
            dist/openfortitray-windows-amd64.exe
            dist/OpenFortiTray-${{ env.SETUP_VERSION }}-Setup.exe
            dist/SHA256SUMS.windows
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [build-darwin, build-linux, build-windows]
    # Publish only for a real tag push; workflow_dispatch dry-runs build and
    # verify the artifacts but never create a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that writes: it creates the release and uploads the assets.
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Assemble SHA256SUMS
        # Concatenate the per-runner manifests rather than re-hashing here.
        # Re-hashing would be circular: it would record whatever bytes arrived,
        # so a corrupted transfer would produce a self-consistent file that
        # verifies fine. These hashes were taken before upload, so the -c step
        # below is a real end-to-end check. Bare filenames (working-directory:
        # dist) keep `sha256sum -c SHA256SUMS` working for users too.
        working-directory: dist
        run: |
          cat SHA256SUMS.darwin SHA256SUMS.linux SHA256SUMS.windows > SHA256SUMS
          rm SHA256SUMS.darwin SHA256SUMS.linux SHA256SUMS.windows
          cat SHA256SUMS

      - name: Verify SHA256SUMS
        # Fails the job on any upload/download corruption instead of publishing
        # binaries that do not match their own published checksums.
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Make unix binaries executable
        # upload-artifact does not preserve the exec bit. Done after
        # verification: chmod changes the mode, not the bytes, so ordering is
        # cosmetic, but verifying the artifacts exactly as received is clearer.
        # The .dmg (a disk image) and the .exe are left alone.
        working-directory: dist
        run: chmod +x openfortitray-darwin-arm64 openfortitray-linux-amd64

      - name: Create GitHub Release
        # `gh release create` over softprops/action-gh-release: gh is preinstalled
        # on GitHub-hosted runners, so publishing — the one step holding a
        # contents: write token — runs no third-party code that would need
        # SHA-pinning and auditing on every bump. --verify-tag refuses to publish
        # if the tag is not present on the remote.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The Setup.exe filename carries the version with the leading v
          # stripped (matching the .iss OutputBaseFilename), unlike the tag-named
          # .dmg — so it is derived separately here.
          SETUP_VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            "dist/OpenFortiTray-${GITHUB_REF_NAME}.dmg" \
            "dist/OpenFortiTray-${SETUP_VERSION}-Setup.exe" \
            dist/openfortitray-darwin-arm64 \
            dist/openfortitray-linux-amd64 \
            dist/openfortitray-windows-amd64.exe \
            dist/SHA256SUMS
