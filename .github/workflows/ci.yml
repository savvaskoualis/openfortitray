name: CI

# Runs on every branch push and on pull requests. Two platforms, because the
# tray layer is the platform-specific part: linux systray is pure Go (D-Bus),
# macOS systray is cgo/Cocoa, so a green Linux build says nothing about the
# darwin path. Windows is covered by the release cross-build only — there is no
# windows runner here because `go test -race` on windows/amd64 needs a gcc
# toolchain we do not otherwise depend on.
on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: CI only ever reads the tree.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      # Third-party actions are pinned to full commit SHAs, not floating tags: a
      # tag can be repointed at new code, so `@v4` is a standing write into every
      # job that uses it. The trailing comment records the human-readable version.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          # setup-go@v5 caches the module and build caches by default, keyed on
          # go.sum; no separate actions/cache step needed.
          cache: true

      - name: Check gofmt
        # `gofmt -l` first so a failure names the offending files in the log,
        # then the assertion that the list is empty.
        run: |
          gofmt -l cmd internal
          test -z "$(gofmt -l cmd internal)"

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      # The windows-only files (internal/autostart/autostart_windows.go, the
      # scheduled-task path) are invisible to the two runners above: build
      # constraints exclude them, so a compile error there would first surface
      # when release.yml cross-builds at tag time — after the tag exists. This
      # type-checks them on every push. Build only, no test: `go test` would need
      # a windows runner to execute anything.
      - name: Cross-build for windows
        if: runner.os == 'Linux'
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...

      # Shell syntax gate for the installer and the privileged helper. Linux
      # only: these are parse checks, not execution, so one platform suffices.
      # install.sh is bash (arrays, [[ ]]); postern-tunnel is strict POSIX sh
      # because it runs from a sudoers rule under an unknown login shell.
      - name: Shell syntax check
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/install.sh
          sh -n scripts/postern-tunnel
