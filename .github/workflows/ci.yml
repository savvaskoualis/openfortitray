name: CI

# Runs on every branch push and on pull requests. Two platforms, because the
# tray layer is the platform-specific part. Since the tray moved to fyne v2 it
# renders through OpenGL/GLFW, so BOTH runners now build with cgo: linux needs
# GL + X11 dev headers (installed below), macOS uses the system frameworks and
# Xcode CLT already on the runner. Windows is a special case: fyne makes
# cmd/openfortitray a cgo+GLFW build that cannot cross-compile from Linux, so the
# full windows binary is built on a windows-latest runner in the packaging task
# (see the release.yml TODO). Here we only type-check the windows-specific,
# non-GUI code (autostart_windows.go), which stays cgo-free.
on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: CI only ever reads the tree.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      # Third-party actions are pinned to full commit SHAs, not floating tags: a
      # tag can be repointed at new code, so `@v4` is a standing write into every
      # job that uses it. The trailing comment records the human-readable version.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          # setup-go@v5 caches the module and build caches by default, keyed on
          # go.sum; no separate actions/cache step needed.
          cache: true

      # fyne renders through OpenGL/GLFW, so building or even type-checking the
      # tray (and anything that imports fyne/v2/app) needs cgo plus GL and X11
      # dev headers. `go vet`/`go test -race`/`go build` below all compile
      # cmd/openfortitray, so these must be present first. This is fyne's
      # documented Linux build-dependency set. macOS uses system frameworks.
      - name: Install GL/X11 build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Check gofmt
        # `gofmt -l` first so a failure names the offending files in the log,
        # then the assertion that the list is empty.
        run: |
          gofmt -l cmd internal
          test -z "$(gofmt -l cmd internal)"

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      # The windows-only files (internal/autostart/autostart_windows.go, the
      # scheduled-task path) are invisible to the two runners above: build
      # constraints exclude them, so a compile error there would first surface
      # at tag time. This type-checks them on every push.
      #
      # Scope is ./internal/... , not ./... , because cmd/openfortitray now imports
      # fyne/v2/app -> GLFW -> OpenGL, a cgo build the go toolchain cannot
      # cross-compile from Linux (the gl package's files are build-excluded
      # without cgo). CGO_ENABLED=0 is explicit: none of ./internal/... needs cgo
      # for windows — the tray imports only fyne core + driver/desktop (pure Go),
      # not the GL driver. The full windows cgo/GLFW build is covered by the
      # windows-latest runner added in the packaging task (release.yml TODO).
      # Build only, no test: `go test` would need a windows runner to execute.
      - name: Type-check windows-only code
        if: runner.os == 'Linux'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build ./internal/...

      # Shell syntax gate for the installer and the privileged helper. Linux
      # only: these are parse checks, not execution, so one platform suffices.
      # install.sh is bash (arrays, [[ ]]); openfortitray-tunnel is strict POSIX sh
      # because it runs from a sudoers rule under an unknown login shell.
      - name: Shell syntax check
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/install.sh
          sh -n scripts/openfortitray-tunnel
