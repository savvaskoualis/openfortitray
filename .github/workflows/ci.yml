name: CI

# Runs on every branch push and on pull requests. cmd/openfortitray is a cgo
# build on EVERY OS: the UI is Qt6 via miqt (see cmd/openfortitray/qtapp.go),
# a cgo+C++ dependency (Fyne was fully removed from this codebase — see the
# migration history). That kills the old "type-check windows on ubuntu" trick
# (cgo windows cannot cross-compile from Linux), so the matrix spans all three
# real runners: linux installs Qt6's dev headers via apt (below), macOS uses
# the system frameworks + Xcode CLT plus Homebrew Qt6, and windows uses the
# runner's bundled MinGW gcc plus an MSYS2-installed Qt6. Each runner does the
# full gofmt / vet / test -race / build pass against its own native toolchain,
# with CGO_CXXFLAGS=-std=c++17 (job env, below) so Qt6's C++17-only headers
# compile under cgo's C++ front end.
on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: CI only ever reads the tree.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# bash everywhere, including the windows runner (Git Bash), so the gofmt /
# shell-syntax steps below are written once and behave identically.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # cgo is mandatory on all three OSes (Qt6 via miqt). Setting it at the
    # job level covers vet, test -race and build in one place.
    env:
      CGO_ENABLED: '1'
      CGO_CXXFLAGS: '-std=c++17'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      # Third-party actions are pinned to full commit SHAs, not floating tags: a
      # tag can be repointed at new code, so `@v4` is a standing write into every
      # job that uses it. The trailing comment records the human-readable version.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          # setup-go@v5 caches the module and build caches by default, keyed on
          # go.sum; no separate actions/cache step needed.
          cache: true

      - name: Install Qt6 (Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install qt pkg-config

      # windows-latest ships MinGW-w64 but does NOT put it on PATH
      # (actions/runner-images #6103/#8399), so a CGO=1 vet/test/build would
      # fail for want of a C compiler. Install a known-good gcc via a pinned
      # setup-msys2 and prepend its bin to PATH ourselves. Linux uses the apt
      # deps below; macOS uses system frameworks (+ Homebrew Qt6 above) —
      # neither needs this.
      #
      # UCRT64 (not MINGW64): miqt's README documents UCRT64 + qt6-base as a
      # tested native-Windows recipe for Qt6.
      - name: Set up MinGW-w64 + Qt6 (MSYS2 UCRT64)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkg-config mingw-w64-ucrt-x86_64-qt6-base

      - name: Put MinGW-w64 gcc on PATH
        if: runner.os == 'Windows'
        # setup-msys2 exposes gcc only inside its own `msys2 {0}` shell, but the
        # steps below run in Git Bash (defaults.run.shell: bash). Prepend the
        # UCRT64 bin dir to PATH so cgo's go toolchain finds gcc, then confirm.
        run: |
          printf '%s\n' "${{ steps.msys2.outputs.msys2-location }}\\ucrt64\\bin" >> "$GITHUB_PATH"

      - name: Verify C toolchain
        if: runner.os == 'Windows'
        run: gcc --version

      # Windows only: generate the *.syso from the app manifest so `go vet` /
      # `go build` below link it, proving the requireAdministrator manifest
      # embeds without error on every push. Go auto-links the GOOS/GOARCH-scoped
      # resource in the main package dir into the windows exe only; the .syso is
      # a build artifact (gitignored), regenerated here from the checked-in
      # manifest with the pinned, pure-Go rsrc tool. -arch amd64 matches the
      # windows runner's GOARCH.
      - name: Embed Windows manifest (generate .syso)
        if: runner.os == 'Windows'
        run: |
          go run github.com/akavel/rsrc@v0.10.2 \
            -manifest cmd/openfortitray/openfortitray.manifest \
            -arch amd64 \
            -o cmd/openfortitray/resource_windows_amd64.syso

      # cmd/openfortitray links against Qt6 (miqt; see qtapp.go), which needs
      # the Qt6 dev headers/pkg-config files (qt6-base-dev) to even
      # compile-check, let alone build. macOS uses system frameworks +
      # Homebrew Qt6, and windows uses the runner's bundled MinGW gcc + MSYS2
      # Qt6 above, so neither needs this step.
      - name: Install Qt6 build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config qt6-base-dev

      - name: Check gofmt
        # `gofmt -l` first so a failure names the offending files in the log,
        # then the assertion that the list is empty.
        run: |
          gofmt -l cmd internal
          test -z "$(gofmt -l cmd internal)"

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - name: go build
        run: go build ./...

      # Shell syntax gate for the installer and the privileged helper. Linux
      # only: these are parse checks, not execution, so one platform suffices.
      # install.sh is bash (arrays, [[ ]]); openfortitray-tunnel is strict POSIX
      # sh because it runs from a sudoers rule under an unknown login shell.
      - name: Shell syntax check
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/*.sh
          sh -n scripts/openfortitray-tunnel
