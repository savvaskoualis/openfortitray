name: CI

# Runs on every branch push and on pull requests. cmd/openfortitray is a Wails
# v2 app (see cmd/openfortitray/wailsapp.go) — Qt/miqt and Fyne were both fully
# removed from this codebase (see the migration history). Wails' darwin and
# linux frontends need cgo (Cocoa/WebKit on darwin, GTK3/WebKit2GTK on linux),
# so those two run on their own native runners with CGO_ENABLED=1. windows is
# different: Wails' windows webview binding (wailsapp/go-webview2) and
# energye/systray's windows backend are both pure Go (no `import "C"` in
# either), so windows runs with CGO_ENABLED=0 and needs no C toolchain at all
# — see release.yml's build-windows job, which established this. Each runner
# does the full gofmt / vet / test -race / build pass against its own native
# toolchain.
on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: CI only ever reads the tree.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# bash everywhere, including the windows runner (Git Bash), so the gofmt /
# shell-syntax steps below are written once and behave identically.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    # cgo is needed on darwin (Cocoa/WebKit) and linux (GTK3/WebKit2GTK) for
    # Wails' frontend, but not on windows (see the job header comment above).
    env:
      CGO_ENABLED: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
    steps:
      # Third-party actions are pinned to full commit SHAs, not floating tags: a
      # tag can be repointed at new code, so `@v4` is a standing write into every
      # job that uses it. The trailing comment records the human-readable version.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          # setup-go@v5 caches the module and build caches by default, keyed on
          # go.sum; no separate actions/cache step needed.
          cache: true

      # Windows only: generate the *.syso from the app manifest so `go vet` /
      # `go build` below link it, proving the requireAdministrator manifest
      # embeds without error on every push. Go auto-links the GOOS/GOARCH-scoped
      # resource in the main package dir into the windows exe only; the .syso is
      # a build artifact (gitignored), regenerated here from the checked-in
      # manifest with the pinned, pure-Go rsrc tool. -arch amd64 matches the
      # windows runner's GOARCH. This needs no cgo/C toolchain (rsrc is pure Go).
      - name: Embed Windows manifest (generate .syso)
        if: runner.os == 'Windows'
        run: |
          go run github.com/akavel/rsrc@v0.10.2 \
            -manifest cmd/openfortitray/openfortitray.manifest \
            -arch amd64 \
            -o cmd/openfortitray/resource_windows_amd64.syso

      # cmd/openfortitray links against Wails v2 (see cmd/openfortitray/main.go,
      # wailsapp.go), whose linux frontend cgo-imports gtk+-3.0 and
      # webkit2gtk-4.x via pkg-config to build. ubuntu-latest is now 24.04
      # (Noble), which dropped libwebkit2gtk-4.0-dev entirely — only
      # libwebkit2gtk-4.1-dev is packaged there — so this installs the 4.1 dev
      # package and every Linux vet/test/build invocation below passes
      # -tags webkit2_41 to select it (the cgo pkg-config directive defaults to
      # webkit2gtk-4.0 without that tag). This is Wails' own documented fix for
      # Ubuntu 24.04+ (wailsapp/wails#3465, #3513), mirroring release.yml's
      # build-linux job. macOS uses system frameworks (Cocoa/WebKit); windows
      # needs no cgo at all (see the job header comment above).
      - name: Install webkit2gtk/GTK3 build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Check gofmt
        # `gofmt -l` first so a failure names the offending files in the log,
        # then the assertion that the list is empty.
        run: |
          gofmt -l cmd internal
          test -z "$(gofmt -l cmd internal)"

      - name: go vet
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            go vet -tags webkit2_41 ./...
          else
            go vet ./...
          fi

      # -race requires cgo, and windows runs with CGO_ENABLED=0 (see the note
      # above this job's env block) — go build/test itself would refuse a
      # -race invocation there ("go: -race requires cgo"), not just skip it
      # silently, so windows runs the plain (non-race) suite instead.
      - name: go test -race
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            go test -race -tags webkit2_41 ./...
          elif [ "${{ runner.os }}" = "Windows" ]; then
            go test ./...
          else
            go test -race ./...
          fi

      - name: go build
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            go build -tags webkit2_41 ./...
          else
            go build ./...
          fi

      # Shell syntax gate for the installer and the privileged helper. Linux
      # only: these are parse checks, not execution, so one platform suffices.
      # install.sh is bash (arrays, [[ ]]); openfortitray-tunnel is strict POSIX
      # sh because it runs from a sudoers rule under an unknown login shell.
      - name: Shell syntax check
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/*.sh
          sh -n scripts/openfortitray-tunnel
